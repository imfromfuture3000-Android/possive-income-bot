name: Deploy Jekyll + Solana Program

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # Setup Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Build with Jekyll
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      # Upload site artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Deploy site to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # -----------------------------
      # 🔥 Solana Program Deployment
      # -----------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal
          components: rustfmt, clippy

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.solana.com/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: cargo install --git https://github.com/coral-xyz/anchor anchor-cli --locked

      - name: Setup Solana Environment
        run: |
          mkdir -p ~/.config/solana
          echo "${{ secrets.SOLANA_KEYPAIR }}" > ~/.config/solana/id.json
          echo "RPC_URL=${{ secrets.SOLANA_RPC_URL }}" >> $GITHUB_ENV
          echo "SOLANA_CLUSTER=${{ secrets.SOLANA_CLUSTER }}" >> $GITHUB_ENV
          echo "WALLET_KEYPAIR=~/.config/solana/id.json" >> $GITHUB_ENV

      - name: Deploy Solana Program
        run: |
          echo "🚀 Starting deployment..."
          solana config set --url $RPC_URL
          solana config set --keypair $WALLET_KEYPAIR
          anchor build
          anchor deploy --provider.cluster $SOLANA_CLUSTER
          PROGRAM_ID=$(solana address -k target/deploy/*.json)
          echo "✅ Program deployed with ID: $PROGRAM_ID"
          node scripts/generate_pdas.js $PROGRAM_ID
